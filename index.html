<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>于锦辉 · Yu Jinhui · Portfolio</title>
<style>
/* ============================================================
   0. 设计系统 · 字体与变量
   ============================================================ */
:root{
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --serif: "Playfair Display", "Songti SC", "SimSun", "Noto Serif CJK SC", Georgia, serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --navh: 68px;

  /* 苏大红体系 */
  --suda-deep:#6B0F0F;
  --suda-red:#A81C1C;
  --suda-red-2:#C43333;
  --suda-soft:rgba(168,28,28,.08);

  /* 烫金体系 */
  --gold-deep:#7A5B22;
  --gold:#A8843F;
  --gold-2:#C9A96E;
  --gold-3:#E0C68A;
  --gold-light:#F5E6C0;
  --gold-soft:rgba(168,132,63,.12);
  --gold-line:rgba(168,132,63,.32);

  /* 国际化辅助色 */
  --intl-blue:#1E3A8A;
  --intl-blue-soft:rgba(30,58,138,.08);
  --intl-ink:#0F172A;

  /* 烫金渐变 */
  --foil:linear-gradient(115deg,#7A5B22 0%,#A8843F 18%,#E0C68A 32%,#F5E6C0 42%,#C9A96E 56%,#A8843F 72%,#7A5B22 100%);
  --foil-h:linear-gradient(90deg,#7A5B22,#C9A96E 22%,#F5E6C0 50%,#C9A96E 78%,#7A5B22);
  --foil-v:linear-gradient(180deg,#7A5B22,#C9A96E 35%,#F5E6C0 55%,#C9A96E 78%,#7A5B22);
  --foil-diag:linear-gradient(135deg,#A8843F,#F5E6C0 45%,#A8843F);

  --bg:#FBF4EA;
  --bg-2:#FDF6EC;
  --surface:rgba(255,253,250,.82);
  --surface-2:rgba(255,253,250,.96);
  --chip:rgba(255,253,250,.7);
  --text:#231414;
  --text-2:#5A4038;
  --text-3:#8C7268;
  --border:rgba(107,15,15,.10);
  --border-2:rgba(107,15,15,.18);
  --shadow:0 1px 2px rgba(107,15,15,.05),0 18px 40px -24px rgba(107,15,15,.32);
  --shadow-lg:0 28px 62px -30px rgba(168,28,28,.6);
  --r:18px;--r-lg:26px;

  --page-bg-opacity:.05;
}
html[data-theme="dark"]{
  --suda-deep:#3D0808;
  --suda-red:#D64545;
  --suda-red-2:#E86A5A;
  --suda-soft:rgba(214,69,69,.12);
  --gold-deep:#8A6B2E;
  --gold:#D4B87A;
  --gold-2:#E2CB94;
  --gold-3:#F0DDA8;
  --gold-light:#F8ECCB;
  --gold-soft:rgba(212,184,122,.12);
  --gold-line:rgba(212,184,122,.28);
  --intl-blue:#60A5FA;
  --intl-blue-soft:rgba(96,165,250,.12);
  --intl-ink:#F5E8DF;

  --foil:linear-gradient(115deg,#8A6B2E 0%,#C9A96E 18%,#F0DDA8 32%,#F8ECCB 42%,#E2CB94 56%,#C9A96E 72%,#8A6B2E 100%);
  --foil-h:linear-gradient(90deg,#8A6B2E,#E2CB94 22%,#F8ECCB 50%,#E2CB94 78%,#8A6B2E);
  --foil-v:linear-gradient(180deg,#8A6B2E,#E2CB94 35%,#F8ECCB 55%,#E2CB94 78%,#8A6B2E);
  --foil-diag:linear-gradient(135deg,#C9A96E,#F8ECCB 45%,#C9A96E);

  --bg:#150808;
  --bg-2:#1C0B0B;
  --surface:rgba(38,16,16,.72);
  --surface-2:rgba(38,16,16,.94);
  --chip:rgba(255,255,255,.05);
  --text:#F5E8DF;
  --text-2:#C4A79B;
  --text-3:#8E7167;
  --border:rgba(212,184,122,.14);
  --border-2:rgba(212,184,122,.24);
  --shadow:0 1px 2px rgba(0,0,0,.6),0 22px 52px -26px rgba(0,0,0,.95);
  --shadow-lg:0 32px 70px -32px rgba(214,69,69,.7);
  --page-bg-opacity:.07;
}

/* ============================================================
   1. 基础
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;height:100vh;display:flex;flex-direction:column;overflow:hidden;
  font-family:var(--font);background:var(--bg);color:var(--text);font-size:16px;line-height:1.72;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  transition:background-color .4s ease,color .4s ease;
}
@supports (height:100dvh){body{height:100dvh}}
a{color:inherit}
::selection{background:var(--suda-soft);color:var(--suda-red)}
:focus-visible{outline:2px solid var(--gold-2);outline-offset:3px;border-radius:10px}

/* 双语：默认显示中文，data-lang=en 时显示英文 */
[data-lang="zh"] .lang-en{display:none !important}
[data-lang="en"] .lang-zh{display:none !important}

/* ============================================================
   2. 全局背景层
   ============================================================ */
.bg-layer{position:fixed;inset:-10%;z-index:-3;pointer-events:none;
  background:
    radial-gradient(1200px 720px at 8% -12%,rgba(168,28,28,.18),transparent 62%),
    radial-gradient(1000px 640px at 102% -4%,rgba(201,169,110,.22),transparent 58%),
    radial-gradient(900px 560px at 46% 112%,rgba(107,15,15,.16),transparent 62%);
  animation:bgFloat 24s ease-in-out infinite}
html[data-theme="dark"] .bg-layer{
  background:
    radial-gradient(1200px 720px at 8% -12%,rgba(214,69,69,.22),transparent 62%),
    radial-gradient(1000px 640px at 102% -4%,rgba(212,184,122,.16),transparent 58%),
    radial-gradient(900px 560px at 46% 112%,rgba(61,8,8,.35),transparent 62%)}
@keyframes bgFloat{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(1.6%,-1.6%,0) scale(1.06)}}

#particles{position:fixed;inset:0;z-index:-2;pointer-events:none;width:100%;height:100%}

.bg-grid{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:linear-gradient(rgba(168,28,28,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(168,28,28,.05) 1px,transparent 1px);
  background-size:58px 58px;
  -webkit-mask-image:radial-gradient(ellipse 84% 64% at 50% 0%,#000 16%,transparent 78%);
  mask-image:radial-gradient(ellipse 84% 64% at 50% 0%,#000 16%,transparent 78%)}
html[data-theme="dark"] .bg-grid{
  background-image:linear-gradient(rgba(212,184,122,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(212,184,122,.05) 1px,transparent 1px)}

.bg-silk{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:
    repeating-linear-gradient(0deg,rgba(168,28,28,.018) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(90deg,rgba(168,132,63,.015) 0 1px,transparent 1px 4px);
  mix-blend-mode:multiply}
html[data-theme="dark"] .bg-silk{
  background-image:
    repeating-linear-gradient(0deg,rgba(212,184,122,.025) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(90deg,rgba(214,69,69,.018) 0 1px,transparent 1px 4px);
  mix-blend-mode:screen;opacity:.35}

.spotlight{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(480px circle at var(--mx,50%) var(--my,40%),rgba(201,169,110,.13),transparent 68%);
  opacity:0;transition:opacity .5s ease}
body.pointer-on .spotlight{opacity:1}

.corner-frame{position:fixed;inset:14px;z-index:55;pointer-events:none}
.corner-frame i{position:absolute;width:30px;height:30px;
  border-color:transparent;border-style:solid;border-width:0}
.corner-frame i::before{
  content:"";position:absolute;inset:0;
  border-color:var(--gold-line);border-style:solid;border-width:0;
  filter:drop-shadow(0 0 2px rgba(201,169,110,.4))}
.corner-frame i:nth-child(1){top:0;left:0}
.corner-frame i:nth-child(1)::before{border-top-width:1.5px;border-left-width:1.5px;border-top-left-radius:8px}
.corner-frame i:nth-child(2){top:0;right:0}
.corner-frame i:nth-child(2)::before{border-top-width:1.5px;border-right-width:1.5px;border-top-right-radius:8px}
.corner-frame i:nth-child(3){bottom:0;left:0}
.corner-frame i:nth-child(3)::before{border-bottom-width:1.5px;border-left-width:1.5px;border-bottom-left-radius:8px}
.corner-frame i:nth-child(4){bottom:0;right:0}
.corner-frame i:nth-child(4)::before{border-bottom-width:1.5px;border-right-width:1.5px;border-bottom-right-radius:8px}

.scroll-progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:120;pointer-events:none}
.scroll-progress i{display:block;height:100%;width:0;background:var(--foil-h);background-size:200% 100%;
  border-radius:0 4px 4px 0;box-shadow:0 0 14px rgba(201,169,110,.85);transition:width .08s linear}

/* ============================================================
   3. 导航
   ============================================================ */
.nav{flex:none;position:relative;z-index:90;background:var(--surface-2);border-bottom:1px solid var(--border);
  -webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px)}
.nav::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1.5px;
  background:var(--foil-h);box-shadow:0 1px 3px rgba(168,132,63,.35);opacity:.85}

.nav-inner{max-width:1240px;margin:0 auto;padding:.55rem 1.4rem;display:flex;align-items:center;gap:1rem}

.suda-emblem{
  width:38px;height:38px;flex:none;display:block;
  filter:drop-shadow(0 2px 5px rgba(107,15,15,.35));
  transition:transform .25s ease;
}
.suda-emblem:hover{transform:scale(1.08) rotate(-3deg)}
html[data-theme="dark"] .suda-emblem{filter:drop-shadow(0 2px 6px rgba(212,184,122,.4))}

.brand{display:inline-flex;align-items:center;gap:.6rem;font-weight:900;font-size:.98rem;text-decoration:none;color:var(--text);white-space:nowrap;transition:transform .2s ease}
.brand:hover{transform:translateY(-1px)}

.nav-links{display:flex;gap:.1rem;margin-left:auto;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{position:relative;padding:.4rem .72rem;border-radius:999px;font-size:.84rem;font-weight:600;color:var(--text-3);text-decoration:none;white-space:nowrap;
  transition:color .18s ease,background-color .18s ease}
.nav-links a:hover{color:var(--text);background:var(--suda-soft)}
.nav-links a.active{color:var(--suda-red);background:var(--suda-soft)}
html[data-theme="dark"] .nav-links a.active{color:var(--gold-2)}
.nav-links a.active::after{content:"";position:absolute;left:50%;bottom:2px;width:18px;height:1.5px;margin-left:-9px;border-radius:2px;
  background:var(--foil-h);box-shadow:0 0 6px rgba(201,169,110,.7)}

.nav-actions{display:flex;gap:.4rem;flex:none}

/* 语言切换 */
.lang-toggle{
  display:inline-flex;align-items:center;
  border:1px solid var(--border);border-radius:999px;
  background:var(--surface);overflow:hidden;flex:none;
}
.lang-toggle button{
  padding:.34rem .68rem;border:none;background:transparent;
  font-family:inherit;font-size:.72rem;font-weight:900;letter-spacing:.04em;
  color:var(--text-3);cursor:pointer;
  transition:background-color .18s ease,color .18s ease;
}
.lang-toggle button.active{
  background:linear-gradient(135deg,#6B0F0F,#A81C1C);
  color:#F5E6C0;
}
html[data-theme="dark"] .lang-toggle button.active{
  background:linear-gradient(135deg,#C9A96E,#E2CB94);color:#2A1808;
}
.lang-toggle button:hover:not(.active){color:var(--text);background:var(--suda-soft)}

.icon-btn{width:36px;height:36px;flex:none;display:grid;place-items:center;border:1px solid var(--border);border-radius:11px;background:var(--surface);color:var(--text);cursor:pointer;
  transition:transform .18s ease,border-color .18s ease,color .18s ease,box-shadow .18s ease}
.icon-btn:hover{transform:translateY(-2px);border-color:var(--gold-2);color:var(--gold);
  box-shadow:0 10px 22px -14px rgba(201,169,110,.95),inset 0 0 0 1px rgba(201,169,110,.15)}
.icon-btn:active{transform:translateY(0) scale(.95)}
.icon-btn svg{width:17px;height:17px;display:block}
html[data-theme="dark"] .icon-sun{display:none}
html[data-theme="light"] .icon-moon{display:none}

/* ============================================================
   4. 翻页容器
   ============================================================ */
.deck{position:relative;flex:1 1 auto;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y proximity;scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;z-index:1}

.page{position:relative;min-height:calc(100vh - var(--navh));scroll-snap-align:start;display:flex;flex-direction:column;padding:2.2rem 0 4.6rem;overflow:hidden}
@supports (min-height:100dvh){.page{min-height:calc(100dvh - var(--navh))}}
.page-inner{margin-block:auto;width:100%;position:relative;z-index:2}
.wrap{max-width:1240px;margin:0 auto;padding:0 1.4rem;position:relative;z-index:2}

/* 主题背景建筑 */
.page-bg{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  display:grid;place-items:center;overflow:hidden;
  opacity:var(--page-bg-opacity);transition:opacity .6s ease;
}
.page-bg svg{width:min(78vmin,720px);height:auto;color:var(--suda-red);filter:blur(.3px)}
html[data-theme="dark"] .page-bg svg{color:var(--gold-2)}

.page::before{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(ellipse 70% 50% at 50% 50%,transparent 30%,var(--bg) 92%),
    linear-gradient(180deg,transparent 60%,var(--bg) 100%);
  opacity:.85;
}

.page::after{content:attr(data-num);position:absolute;right:1.6rem;bottom:1.1rem;font-size:4.6rem;font-weight:900;line-height:1;letter-spacing:-.05em;
  font-family:var(--serif);color:var(--suda-red);opacity:.05;pointer-events:none;user-select:none;z-index:3}
html[data-theme="dark"] .page::after{color:var(--gold-2);opacity:.07}

.page-bg-label{
  position:absolute;left:1.6rem;bottom:1.5rem;z-index:3;
  display:flex;align-items:center;gap:.5rem;
  font-size:.68rem;font-weight:800;letter-spacing:.16em;
  color:var(--text-3);text-transform:uppercase;opacity:.7;
}
.page-bg-label .seal{
  width:22px;height:22px;display:grid;place-items:center;
  font-family:var(--serif);font-size:.62rem;font-weight:900;
  color:var(--suda-red);background:var(--suda-soft);
  border:1px solid var(--border);border-radius:4px;
}
html[data-theme="dark"] .page-bg-label .seal{color:var(--gold-2)}

/* ============================================================
   5. 段落标题
   ============================================================ */
.section-head{display:flex;align-items:center;gap:.8rem;margin-bottom:1.45rem}
.lotus{width:26px;height:26px;flex:none;color:var(--gold);
  filter:drop-shadow(0 1px 0 rgba(255,240,200,.5)) drop-shadow(0 2px 5px rgba(168,132,63,.5))}
.section-head h2{margin:0;font-size:1.3rem;font-weight:900;letter-spacing:-.015em;flex:none;color:var(--text)}
.section-head .line{flex:1;height:1.5px;position:relative;background:var(--foil-h);background-size:200% 100%;
  box-shadow:0 1px 2px rgba(168,132,63,.28);
  -webkit-mask-image:linear-gradient(90deg,#000,transparent);mask-image:linear-gradient(90deg,#000,transparent)}
.section-head .line::before{content:"";position:absolute;left:0;top:-3px;width:7px;height:7px;
  background:var(--foil-diag);transform:rotate(45deg);border-radius:1px;
  box-shadow:0 0 6px rgba(201,169,110,.8),inset 0 1px 0 rgba(255,240,200,.6)}
.section-head .idx{font-size:.66rem;font-weight:900;letter-spacing:.16em;color:var(--suda-red);text-transform:uppercase;flex:none;
  padding:.2rem .5rem;border-radius:6px;background:var(--suda-soft);border:1px solid var(--border)}
html[data-theme="dark"] .section-head .idx{color:var(--gold-2)}

.tassel{position:relative;display:inline-block}
.tassel::after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:2px;
  background:var(--foil-h);background-size:200% 100%;border-radius:2px;
  box-shadow:0 1px 3px rgba(168,132,63,.5)}

/* ============================================================
   6. 卡片基类
   ============================================================ */
.card{
  position:relative;border-radius:var(--r);
  background:var(--surface);border:1px solid var(--border);
  box-shadow:
    0 1px 2px rgba(107,15,15,.05),
    0 18px 40px -24px rgba(107,15,15,.32),
    inset 0 1px 0 rgba(255,255,255,.5);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s ease,border-color .22s ease,background-color .4s ease;
}
html[data-theme="dark"] .card{
  box-shadow:
    0 1px 2px rgba(0,0,0,.6),
    0 22px 52px -26px rgba(0,0,0,.95),
    inset 0 1px 0 rgba(255,255,255,.04);
}
.card::before{
  content:"";position:absolute;left:0;top:16px;bottom:16px;width:2.5px;
  border-radius:0 2px 2px 0;
  background:var(--foil-v);background-size:100% 200%;
  opacity:.85;pointer-events:none;
  box-shadow:0 0 8px rgba(201,169,110,.45);
  transition:opacity .3s ease,top .3s ease,bottom .3s ease;
}
.card::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(320px circle at var(--gx,50%) var(--gy,50%),rgba(255,255,255,.55),transparent 62%);
  opacity:0;transition:opacity .3s ease;
}
html[data-theme="dark"] .card::after{
  background:radial-gradient(320px circle at var(--gx,50%) var(--gy,50%),rgba(212,184,122,.16),transparent 62%);
}
.card:hover{
  border-color:var(--gold-line);
  box-shadow:
    0 1px 2px rgba(107,15,15,.05),
    0 28px 62px -30px rgba(168,28,28,.6),
    inset 0 1px 0 rgba(255,255,255,.6),
    0 0 0 1px rgba(201,169,110,.2);
}
.card:hover::before{opacity:1;top:10px;bottom:10px}
.card:hover::after{opacity:.75}

.tilt{
  transform:perspective(1000px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(var(--ty,0px));
  transition:transform .16s ease-out,box-shadow .22s ease,border-color .22s ease;
  will-change:transform;
}
.tilt:hover{--ty:-5px}

/* ============================================================
   7. Hero（国际比赛级）
   ============================================================ */
.hero-shell{
  display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,.9fr);gap:2.4rem;align-items:center;
  padding:2.6rem;border-radius:var(--r-lg);position:relative;
  background:var(--surface);border:1px solid var(--border);
  box-shadow:
    0 1px 2px rgba(107,15,15,.06),
    0 28px 66px -30px rgba(107,15,15,.45),
    inset 0 1px 0 rgba(255,255,255,.55);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
}
.hero-shell::before{content:"";position:absolute;left:6%;right:6%;top:0;height:2px;
  background:var(--foil-h);background-size:200% 100%;
  box-shadow:0 1px 4px rgba(201,169,110,.55);border-radius:2px}
.hero-shell::after{content:"";position:absolute;right:-70px;bottom:-80px;width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle,rgba(168,28,28,.10),transparent 68%);pointer-events:none}
@media (max-width:900px){.hero-shell{grid-template-columns:1fr;gap:1.8rem;padding:1.9rem 1.5rem;text-align:center}}

/* 国际化徽章 */
.intl-badge{
  display:inline-flex;align-items:center;gap:.5rem;
  padding:.34rem .82rem;border-radius:999px;
  font-size:.72rem;font-weight:800;letter-spacing:.04em;
  color:var(--intl-blue);background:var(--intl-blue-soft);
  border:1px solid var(--border);margin-bottom:.7rem;
}
html[data-theme="dark"] .intl-badge{color:#93C5FD}
.intl-badge svg{width:13px;height:13px}

.hero-eyebrow{display:inline-flex;align-items:center;gap:.5rem;padding:.32rem .8rem;border-radius:999px;font-size:.74rem;font-weight:800;
  color:var(--suda-red);background:var(--suda-soft);border:1px solid var(--border);margin-bottom:1rem}
html[data-theme="dark"] .hero-eyebrow{color:var(--gold-2)}
.pulse-dot{width:7px;height:7px;border-radius:50%;flex:none;
  background:var(--foil-diag);
  box-shadow:0 0 0 0 rgba(201,169,110,.7),inset 0 1px 0 rgba(255,240,200,.6);
  animation:pulse 2s ease-out infinite}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(201,169,110,.65),inset 0 1px 0 rgba(255,240,200,.6)}
  70%{box-shadow:0 0 0 9px rgba(201,169,110,0),inset 0 1px 0 rgba(255,240,200,.6)}
  100%{box-shadow:0 0 0 0 rgba(201,169,110,0),inset 0 1px 0 rgba(255,240,200,.6)}}

/* 姓名双语并排 */
.hero-name-row{
  display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap;
  margin:0 0 .55rem;
}
.hero h1{
  margin:0;
  font-size:clamp(2.2rem,5.6vw,3.4rem);font-weight:900;letter-spacing:-.04em;line-height:1.08;

.bar{position:relative;height:8px;border-radius:999px;overflow:hidden;background:var(--suda-soft);

/* ============================================================

.edu-grid{display:grid;gap:1.4rem;grid-template-columns:minmax(0,1.32fr) minmax(0,1fr)}

.timeline{position:relative;padding-left:34px}
.timeline::before{content:"";position:absolute;left:7px;top:14px;bottom:14px;width:1.8px;
  background:var(--foil-v);background-size:100% 200%;border-radius:2px;
  box-shadow:0 0 8px rgba(201,169,110,.4);
  -webkit-mask-image:linear-gradient(180deg,#000,transparent);mask-image:linear-gradient(180deg,#000,transparent)}
.tl-item{position:relative;padding-bottom:1.4rem}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:"";position:absolute;left:-34px;top:7px;width:16px;height:16px;background:var(--bg);
  border:2px solid var(--suda-red);border-radius:3px 3px 50% 50%;transform:rotate(45deg);
  box-shadow:0 0 0 3px var(--suda-soft),inset 0 1px 0 rgba(255,240,200,.5);
  transition:transform .25s ease,box-shadow .25s ease}
html[data-theme="dark"] .tl-item::before{border-color:var(--gold-2);box-shadow:0 0 0 3px rgba(212,184,122,.15)}
.tl-item:hover::before{transform:rotate(45deg) scale(1.18);box-shadow:0 0 0 6px var(--suda-soft),0 0 12px rgba(201,169,110,.6)}
.tl-school{margin:0;font-size:1rem;font-weight:900;letter-spacing:-.015em}
.tl-school-en{
  display:block;margin-top:.14rem;
  font-family:var(--serif);font-style:italic;
  font-size:.76rem;font-weight:500;color:var(--text-3);letter-spacing:.02em;
}
.tl-degree{display:block;margin-top:.22rem;font-size:.8rem;font-weight:800;color:var(--suda-red)}
html[data-theme="dark"] .tl-degree{color:var(--gold-2)}
.tl-time{display:inline-block;margin-top:.34rem;font-size:.72rem;font-weight:700;color:var(--text-3);padding:.17rem .56rem;border-radius:999px;
  border:1px solid var(--border);background:var(--chip);font-variant-numeric:tabular-nums}

.award-list{display:grid;gap:.5rem;margin:0;padding:0;list-style:none}
.award-list li{position:relative;padding:.6rem .85rem .6rem 2.1rem;font-size:.82rem;color:var(--text-2);border:1px solid var(--border);border-radius:13px;
  background:var(--surface);box-shadow:inset 0 1px 0 rgba(255,255,255,.5);
  transition:transform .2s cubic-bezier(.2,.8,.2,1),border-color .2s ease,color .2s ease,box-shadow .2s ease}
html[data-theme="dark"] .award-list li{box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.award-list li::before{content:"";position:absolute;left:.78rem;top:50%;width:11px;height:11px;margin-top:-5.5px;
  background:var(--foil-diag);transform:rotate(45deg);border-radius:2px;
  box-shadow:0 0 6px rgba(201,169,110,.75),inset 0 1px 0 rgba(255,240,200,.6)}
.award-list li:hover{transform:translateX(4px);border-color:var(--gold-line);color:var(--text);
  box-shadow:0 12px 28px -20px rgba(168,28,28,.9),inset 0 0 0 1px rgba(201,169,110,.15)}
.award-list li .en{
  display:block;margin-top:.1rem;
  font-family:var(--serif);font-style:italic;
  font-size:.7rem;color:var(--text-3);letter-spacing:.02em;
}

.cert-wall{display:grid;gap:.9rem;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
@media (max-width:680px){.cert-wall{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}}

.cert-card{position:relative;border:1px dashed var(--border-2);border-radius:14px;
  background:var(--surface);padding:.65rem;
  transition:border-color .25s ease,transform .25s ease,box-shadow .25s ease}
.cert-card:hover{border-color:var(--gold-2);transform:translateY(-2px);
  box-shadow:0 16px 32px -22px rgba(168,28,28,.7),inset 0 0 0 1px rgba(201,169,110,.15)}

.cert-cap{display:flex;align-items:center;justify-content:space-between;gap:.4rem;
  font-size:.72rem;font-weight:800;color:var(--text-3);margin-bottom:.55rem}
.cert-cap .name{display:flex;align-items:center;gap:.32rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cert-cap svg{width:13px;height:13px;opacity:.75;flex:none}
.cert-cap .num{font-size:.62rem;font-weight:900;padding:.08rem .34rem;border-radius:5px;
  background:var(--suda-soft);color:var(--suda-red);border:1px solid var(--border)}
html[data-theme="dark"] .cert-cap .num{color:var(--gold-2)}

.cert-frame{position:relative;display:block;width:100%;border-radius:10px;overflow:hidden;
  background:repeating-linear-gradient(45deg,rgba(168,28,28,.035) 0 12px,transparent 12px 24px),var(--bg-2);
  border:1px solid var(--border);transition:border-color .22s ease}
.cert-frame:hover{border-color:var(--gold-line)}
.cert-frame img{display:block;width:100%;height:auto;max-height:230px;object-fit:contain;background:#fff}

.cert-ph{display:flex;flex-direction:column;align-items:center;gap:.4rem;
  padding:1rem .5rem;color:var(--text-3);cursor:pointer;
  transition:background-color .2s ease,color .2s ease}
.cert-ph:hover{background:var(--suda-soft);color:var(--suda-red)}
html[data-theme="dark"] .cert-ph:hover{color:var(--gold-2)}
.cert-ph svg{width:36px;height:36px;opacity:.65}
.cert-ph .big{font-size:.78rem;font-weight:800;color:var(--text-2)}
.cert-ph .small{font-size:.68rem;line-height:1.55;text-align:center;max-width:22ch}

.cert-actions{display:none;gap:.35rem;margin-top:.55rem;flex-wrap:wrap;justify-content:center}
.cert-card.has-cert .cert-actions{display:flex}

.mini-btn{display:inline-flex;align-items:center;gap:.28rem;padding:.3rem .6rem;border-radius:8px;
  font-family:inherit;font-size:.7rem;font-weight:800;color:var(--text-2);background:var(--surface-2);
  border:1px solid var(--border);cursor:pointer;
  transition:transform .16s ease,border-color .16s ease,color .16s ease,box-shadow .16s ease}
.mini-btn svg{width:12px;height:12px;flex:none}
.mini-btn:hover{transform:translateY(-1px);border-color:var(--gold-2);color:var(--suda-red);
  box-shadow:0 8px 18px -12px rgba(201,169,110,.95)}
html[data-theme="dark"] .mini-btn:hover{color:var(--gold-2)}
.mini-btn.danger:hover{border-color:#EF4444;color:#EF4444}

.cert-card.dragover{border-color:var(--suda-red);background:var(--suda-soft)}
.cert-card.dragover .cert-frame{border-color:var(--suda-red)}

.cert-add{border:1.5px dashed var(--border-2);border-radius:14px;background:transparent;padding:1.4rem .8rem;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;
  color:var(--text-3);font-family:inherit;font-size:.76rem;font-weight:800;cursor:pointer;min-height:150px;
  transition:border-color .22s ease,color .22s ease,background-color .22s ease,transform .22s ease}
.cert-add svg{width:22px;height:22px;opacity:.7}
.cert-add:hover{border-color:var(--gold-2);color:var(--suda-red);background:var(--suda-soft);transform:translateY(-2px)}
html[data-theme="dark"] .cert-add:hover{color:var(--gold-2)}

/* ============================================================
   14. 家乡 · 淮安
   ============================================================ */
.hometown-head{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.3rem}
.hometown-title{margin:0;font-size:clamp(1.6rem,3.8vw,2.2rem);font-weight:900;letter-spacing:-.03em;line-height:1.2;
  background:linear-gradient(112deg,#6B0F0F 0%,#A81C1C 40%,#A8843F 70%,#E0C68A 100%);background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:foilShift 8s ease-in-out infinite;
  filter:drop-shadow(0 1px 0 rgba(122,91,34,.4)) drop-shadow(0 3px 6px rgba(168,132,63,.25))}
html[data-theme="dark"] .hometown-title{
  background:linear-gradient(112deg,#F5E6C0 0%,#E0C68A 40%,#D64545 70%,#F5E6C0 100%);background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 1px 0 rgba(0,0,0,.5))}
.hometown-title .en{
  display:inline-block;margin-left:.6rem;
  font-family:var(--serif);font-style:italic;
  font-size:.58em;font-weight:500;color:var(--text-3);
  letter-spacing:.03em;
}
.hometown-sub{margin:.3rem 0 0;font-size:.83rem;color:var(--text-3);font-weight:600}
.hometown-tag{display:inline-flex;align-items:center;gap:.4rem;padding:.32rem .78rem;border-radius:999px;font-size:.74rem;font-weight:800;
  color:var(--suda-red);background:var(--suda-soft);border:1px solid var(--border);white-space:nowrap}
html[data-theme="dark"] .hometown-tag{color:var(--gold-2)}

.hometown-grid{display:grid;gap:.9rem;grid-template-columns:repeat(auto-fit,minmax(232px,1fr))}
.hm-card{padding:1.1rem 1.15rem 1.1rem 1.4rem;display:flex;flex-direction:column;gap:.5rem}
.hm-head{display:flex;align-items:center;gap:.6rem}
.hm-icon{width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;font-size:1rem;line-height:1;
  background:linear-gradient(135deg,var(--suda-soft),rgba(201,169,110,.16));border:1px solid var(--border);
  box-shadow:inset 0 1px 0 rgba(255,240,200,.4)}
.hm-field{margin:0;font-size:.92rem;font-weight:900;letter-spacing:-.01em}
.hm-en{display:block;font-size:.63rem;font-weight:800;letter-spacing:.14em;color:var(--text-3);text-transform:uppercase;margin-top:.06rem}
.hm-list{margin:0;padding:0;list-style:none;display:grid;gap:.38rem}
.hm-list li{position:relative;padding-left:.95rem;font-size:.785rem;color:var(--text-2);line-height:1.62}
.hm-list li::before{content:"";position:absolute;left:0;top:.62em;width:5px;height:5px;border-radius:1px;
  background:var(--foil-diag);transform:rotate(45deg);box-shadow:0 0 4px rgba(201,169,110,.7)}

/* ============================================================
   15. 页脚
   ============================================================ */
.page-footer{margin-top:1.7rem;padding-top:1.15rem;border-top:1px solid var(--border);position:relative;
  display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;font-size:.76rem;color:var(--text-3)}
.page-footer::before{content:"";position:absolute;left:30%;right:30%;top:-1px;height:1px;
  background:var(--foil-h);background-size:200% 100%;box-shadow:0 1px 2px rgba(201,169,110,.4)}
.page-footer b{color:var(--text-2);font-weight:800}
.page-footer .dot{opacity:.5;margin:0 .35rem}

/* ============================================================
   16. 翻页控件
   ============================================================ */
.dot-nav{position:fixed;right:1.15rem;top:50%;transform:translateY(-50%);z-index:70;display:flex;flex-direction:column;gap:.55rem;
  padding:.55rem .42rem;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:var(--shadow)}
.dot{position:relative;width:9px;height:9px;padding:0;border-radius:2px;transform:rotate(45deg);border:1px solid var(--border-2);background:transparent;cursor:pointer;
  transition:transform .2s ease,background-color .2s ease,border-color .2s ease,box-shadow .2s ease}
.dot:hover{transform:rotate(45deg) scale(1.35);border-color:var(--gold-2)}
.dot[aria-current="true"]{background:var(--foil-diag);border-color:transparent;transform:rotate(45deg) scale(1.3);
  box-shadow:0 0 0 4px var(--suda-soft),0 0 10px rgba(201,169,110,.75)}
.dot::after{content:attr(data-label);position:absolute;right:calc(100% + .7rem);top:50%;transform:translateY(-50%) translateX(4px) rotate(-45deg);
  padding:.22rem .56rem;border-radius:8px;font-size:.7rem;font-weight:800;color:var(--text);background:var(--surface-2);border:1px solid var(--border);
  box-shadow:var(--shadow);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease}
.dot:hover::after{opacity:1;transform:translateY(-50%) translateX(0) rotate(-45deg)}

.page-ctrl{position:fixed;left:50%;bottom:1.05rem;transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:.35rem;
  padding:.35rem .42rem;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:var(--shadow)}
.pc-btn{width:32px;height:32px;flex:none;display:grid;place-items:center;border:1px solid transparent;border-radius:50%;background:transparent;color:var(--text-2);
  cursor:pointer;transition:color .18s ease,background-color .18s ease,transform .18s ease,border-color .18s ease}
.pc-btn:hover:not(:disabled){color:var(--suda-red);background:var(--suda-soft);border-color:var(--border);transform:translateY(-1px)}
html[data-theme="dark"] .pc-btn:hover:not(:disabled){color:var(--gold-2)}
.pc-btn:disabled{opacity:.32;cursor:not-allowed}
.pc-btn svg{width:15px;height:15px}
.pc-btn.home{width:auto;padding:0 .6rem;border-radius:999px;font-size:.72rem;font-weight:800;gap:.3rem;display:inline-flex;align-items:center}
.pc-count{min-width:62px;text-align:center;font-size:.76rem;font-weight:800;color:var(--text-2);font-variant-numeric:tabular-nums}
.pc-count b{color:var(--suda-red);font-size:.86rem}
html[data-theme="dark"] .pc-count b{color:var(--gold-2)}

.toast{position:fixed;left:50%;bottom:4.4rem;z-index:130;transform:translate(-50%,20px) scale(.96);padding:.62rem 1.1rem;border-radius:13px;
  font-size:.8rem;font-weight:800;color:#F5E6C0;background:linear-gradient(135deg,#6B0F0F,#A81C1C);
  box-shadow:0 20px 44px -18px rgba(168,28,28,.95),inset 0 1px 0 rgba(255,240,200,.3),
    inset 0 -1px 0 rgba(61,8,8,.6),0 0 0 1px rgba(201,169,110,.4);
  opacity:0;pointer-events:none;transition:opacity .24s ease,transform .24s cubic-bezier(.2,.8,.2,1);max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}

.kbd-hint{position:fixed;left:1.15rem;bottom:1.05rem;z-index:70;display:flex;align-items:center;gap:.6rem;padding:.45rem .75rem;border-radius:12px;
  border:1px solid var(--border);background:var(--surface-2);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  font-size:.7rem;font-weight:700;color:var(--text-3);box-shadow:var(--shadow);opacity:0;transform:translateY(12px);
  transition:opacity .4s ease,transform .4s ease;pointer-events:none}
.kbd-hint.show{opacity:1;transform:none}
.kbd-hint kbd{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 .26rem;border-radius:6px;font-size:.66rem;font-weight:800;
  color:var(--text);background:var(--chip);border:1px solid var(--border)}

.reveal{opacity:0;transform:translateY(20px);will-change:opacity,transform;transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;transform:none}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  .deck{scroll-behavior:auto !important}
  .reveal{opacity:1 !important;transform:none !important}
  .bar>span{width:var(--w) !important}
  .tilt{transform:none !important}
}
@media (max-width:1080px){.dot-nav{display:none}}
@media (max-width:680px){
  body{font-size:15.5px}
  .wrap{padding:0 1rem}
  .section-head h2{font-size:1.15rem}
  .nav-inner{padding:.5rem .9rem;gap:.6rem}
  .brand-text{display:none}
  .suda-emblem{width:34px;height:34px}
  .lang-toggle button{padding:.3rem .55rem;font-size:.68rem}
  .hero-shell{padding:1.6rem 1.15rem;border-radius:22px}
  .avatar-wrap{width:132px;height:132px}
  .gate{max-width:230px}
  .gate-pillar{height:64px}
  .page{padding:1.8rem 0 5rem}
  .page::after{font-size:3.2rem;right:1rem;bottom:.9rem}
  .page-bg svg{width:88vmin}
  .page-bg-label{font-size:.6rem;left:1rem;bottom:1rem}
  .highlight,.exp-card,.project-card,.skill-group{padding:1.15rem 1.1rem 1.15rem 1.35rem}
  .kbd-hint{display:none}

  .corner-frame i{width:20px;height:20px}
  .cert-frame img{max-height:180px}
  .cert-wall{grid-template-columns:1fr 1fr;gap:.6rem}
  .cert-add{min-height:120px;font-size:.7rem}

}
@media print{
  @page{margin:14mm 12mm}
  html,html[data-theme="dark"]{
    --bg:#fff;--bg-2:#fff;--surface:#fff;--surface-2:#fff;--chip:#fff;

  html,body{height:auto !important;overflow:visible !important;display:block !important;background:#fff !important;font-size:11.5pt;line-height:1.6}

  .page::before{display:none !important}
  .page-inner{margin:0 !important}
  .reveal{opacity:1 !important;transform:none !important}

    box-shadow:none !important;background:#fff !important;border-color:#e5e7eb !important}

  .wrap{max-width:100%;padding-left:0;padding-right:0}
  .hero-shell{grid-template-columns:1fr !important;padding:0 0 .8rem;gap:.8rem}

<body>

<div class="bg-layer" aria-hidden="true"></div>
<canvas id="particles" aria-hidden="true"></canvas>
<div class="bg-grid" aria-hidden="true"></div>

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });

  function fmt(s) {
    return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong class="hl">$1</strong>');
  }
  function pointsHTML(points) {
    if (!points || !points.length) return '';
    return '<ul class="points">' + points.map(function (p) { return '<li>' + fmt(p) + '</li>'; }).join('') + '</ul>';
  }
  function tagsHTML(tags) {
    if (!tags || !tags.length) return '';
    return '<div class="tags">' + tags.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div>';
  }
  /* 双语文本：根据当前语言返回字符串，同时包裹双语 span */
  function bi(obj, tag) {
    tag = tag || 'span';
    if (obj == null) return '';
    if (typeof obj === 'string') return esc(obj);
    var zh = obj.zh || '';
    var en = obj.en || '';
    return '<' + tag + ' class="lang-zh">' + esc(zh) + '</' + tag + '>' +
           '<' + tag + ' class="lang-en">' + esc(en) + '</' + tag + '>';
  }

  var toastTimer = null;
  function toast(msg) {
    var el = $('#toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }

  function copyText(text, okMsg) {
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-1000px';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, ta.value.length);
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        toast(ok ? (okMsg || '已复制') : '复制失败，请手动选择');
      } catch (e) { toast('复制失败，请手动选择'); }
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { toast(okMsg || '已复制'); }).catch(fallback);
    } else { fallback(); }
  }

  function injectPageBackgrounds() {
    $$('.page').forEach(function (page) {
      var key = page.getAttribute('data-bg');
      var cfg = PAGE_BG[key];
      if (!cfg) return;
      var bg = document.createElement('div');
      bg.className = 'page-bg';
      bg.setAttribute('aria-hidden', 'true');
      bg.innerHTML = cfg.svg();
      var label = document.createElement('div');
      label.className = 'page-bg-label';
      label.innerHTML = '<span class="seal">' + esc(cfg.seal) + '</span>' +
        '<span class="lang-zh">' + esc(cfg.label.zh) + '</span>' +
        '<span class="lang-en">' + esc(cfg.label.en) + '</span>';
      page.insertBefore(bg, page.firstChild);
      page.appendChild(label);
    });
  }

  function lotusRingSVG() {
    var s = '<svg viewBox="0 0 200 200" fill="none" aria-hidden="true"><g stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">';
    for (var i = 0; i < 8; i++) {
      var a = (i * 45) * Math.PI / 180;
      var x1 = 100 + Math.cos(a) * 76, y1 = 100 + Math.sin(a) * 76;
      var x2 = 100 + Math.cos(a) * 94, y2 = 100 + Math.sin(a) * 94;
      var nx = Math.cos(a + Math.PI / 2) * 7, ny = Math.sin(a + Math.PI / 2) * 7;
      s += '<path d="M' + x1.toFixed(1) + ' ' + y1.toFixed(1) +
        ' Q' + ((x1 + x2) / 2 + nx).toFixed(1) + ' ' + ((y1 + y2) / 2 + ny).toFixed(1) + ' ' + x2.toFixed(1) + ' ' + y2.toFixed(1) +
        ' Q' + ((x1 + x2) / 2 - nx).toFixed(1) + ' ' + ((y1 + y2) / 2 - ny).toFixed(1) + ' ' + x1.toFixed(1) + ' ' + y1.toFixed(1) + 'Z"/>';
    }
    return s + '</g></svg>';
  }

  function renderCertWall() {
    var wall = $('#certWall');

  function bindCertWall() {
    var wall = $('#certWall');
    if (!wall) return;
    wall.querySelectorAll('[data-cert-ph]').forEach(function (ph) {
      ph.addEventListener('click', function () {
        pendingCertId = ph.getAttribute('data-cert-ph');
        openCertPicker();
      });
      ph.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          pendingCertId = ph.getAttribute('data-cert-ph');
          openCertPicker();
        }
      });
    });
    wall.querySelectorAll('[data-cert-replace]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        pendingCertId = btn.getAttribute('data-cert-replace');
        openCertPicker();
      });
    });
    wall.querySelectorAll('[data-cert-view]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var id = btn.getAttribute('data-cert-view');
        var item = findCert(id);
        if (item && item.src) openLightbox(item.src, item.name);
      });
    });
    wall.querySelectorAll('[data-cert-remove]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var id = btn.getAttribute('data-cert-remove');
        var item = findCert(id);
        if (!item) return;
        if (!item.src) {
          if (certsState.list.length <= 1) {
            certsState.list = [{ id: uid(), name: { zh: '证书 1', en: 'Certificate 1' }, src: '' }];
          } else {
            certsState.list = certsState.list.filter(function (c) { return c.id !== id; });
          }
        } else { item.src = ''; }
        saveCerts(); renderCertWall(); toast('证书照片已移除 / Certificate removed');
      });
    });
    wall.querySelectorAll('.cert-frame img').forEach(function (img) {
      var card = img.closest('[data-cert-card]');
      if (!card) return;
      var id = card.getAttribute('data-cert-card');
      img.style.cursor = 'zoom-in';
      img.addEventListener('click', function () {
        var item = findCert(id);
        if (item && item.src) openLightbox(item.src, item.name);
      });
    });
    wall.querySelectorAll('[data-cert-card]').forEach(function (card) {
      card.addEventListener('dragover', function (e) { e.preventDefault(); card.classList.add('dragover'); });
      card.addEventListener('dragleave', function () { card.classList.remove('dragover'); });
      card.addEventListener('drop', function (e) {
        e.preventDefault(); card.classList.remove('dragover');
        var dt = e.dataTransfer;
        if (!dt || !dt.files || !dt.files.length) return;
        var id = card.getAttribute('data-cert-card');
        pendingCertId = id;
        handleCertFile(dt.files[0], id);
      });
    });
    var add = $('#certAdd');
    if (add) {
      add.addEventListener('click', function () {
        certsState.list.push({ id: uid(), name: { zh: '证书 ' + (certsState.list.length + 1), en: 'Certificate ' + (certsState.list.length + 1) }, src: '' });
        saveCerts(); renderCertWall();
        var newCard = wall.querySelector('.cert-card:last-of-type');
        if (newCard) newCard.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'center' });
        pendingCertId = certsState.list[certsState.list.length - 1].id;
        openCertPicker();
      });
    }
  }
  function findCert(id) {
    for (var i = 0; i < certsState.list.length; i++) {
      if (certsState.list[i].id === id) return certsState.list[i];
    }
    return null;
  }
  function openCertPicker() {
    var input = $('#certInput');
    if (!input) return;
    input.value = ''; input.click();
  }
  function handleCertFile(file, targetId) {
    if (!file) return;
    if (!/^image\//.test(file.type)) { toast('请选择图片文件 / Please select an image'); return; }
    if (file.size > 3 * 1024 * 1024) { toast('图片请小于 3MB / Image must be < 3MB'); return; }
    var id = targetId || pendingCertId;
    var reader = new FileReader();
    reader.onload = function (ev) {
      var src = ev.target.result;
      var item = id ? findCert(id) : null;
      if (!item) {
        item = { id: uid(), name: { zh: '证书 ' + (certsState.list.length + 1), en: 'Certificate ' + (certsState.list.length + 1) }, src: src };
        certsState.list.push(item);
      } else { item.src = src; }
      saveCerts(); renderCertWall(); toast('证书已更新 / Certificate updated');
    };
    reader.onerror = function () { toast('读取失败 / Failed to read'); };
    reader.readAsDataURL(file);
    pendingCertId = null;
  }
  function initCertInput() {
    var input = $('#certInput');
    if (!input) return;
    input.addEventListener('change', function () {
      var file = input.files && input.files[0];
      handleCertFile(file, pendingCertId);
    });
  }
  function openLightbox(src, name) {
    if (!src) return;
    var mask = document.createElement('div');
    mask.setAttribute('role', 'dialog');
    mask.style.cssText = 'position:fixed;inset:0;z-index:200;background:rgba(20,5,5,.86);' +
      'display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:4vmin;' +
      'cursor:zoom-out;opacity:0;transition:opacity .22s ease;' +
      '-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)';
    var img = document.createElement('img');
    img.src = src;
    img.alt = 'Certificate';
    img.style.cssText = 'max-width:92vw;max-height:82vh;border-radius:14px;background:#fff;' +
      'box-shadow:0 40px 90px -40px rgba(0,0,0,.9),0 0 0 1px rgba(201,169,110,.55);' +
      'transform:scale(.94);transition:transform .22s cubic-bezier(.2,.8,.2,1)';
    mask.appendChild(img);
    if (name) {
      var cap = document.createElement('div');
      cap.textContent = typeof name === 'string' ? name : (name[currentLang] || name.zh || '');
      cap.style.cssText = 'color:#F5E6C0;font-size:.86rem;font-weight:800;letter-spacing:.04em;' +
        'text-shadow:0 1px 6px rgba(0,0,0,.7);text-align:center;max-width:88vw';
      mask.appendChild(cap);
    }
    document.body.appendChild(mask);
    requestAnimationFrame(function () {
      mask.style.opacity = '1';
      img.style.transform = 'scale(1)';
    });
    function close() {
      mask.style.opacity = '0';
      img.style.transform = 'scale(.94)';
      setTimeout(function () { if (mask.parentNode) mask.parentNode.removeChild(mask); }, 220);
      document.removeEventListener('keydown', onKey);
    }
    function onKey(e) { if (e.key === 'Escape') close(); }
    mask.addEventListener('click', close);
    document.addEventListener('keydown', onKey);
  }

  function createTabs(host, config) {
    if (!host) return;
    var tablist = document.createElement('div');
    tablist.className = 'tabs';
    tablist.setAttribute('role', 'tablist');
    var panels = document.createElement('div');
    panels.className = 'tab-panels';
    var buttons = [];

    config.items.forEach(function (item, i) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tab';
      btn.id = config.id + '-tab-' + item.id;
      btn.setAttribute('role', 'tab');
      btn.setAttribute('aria-controls', config.id + '-panel-' + item.id);
      btn.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
      btn.tabIndex = i === 0 ? 0 : -1;
      btn.innerHTML = '<span class="lang-zh">' + esc(item.label.zh) + '</span><span class="lang-en">' + esc(item.label.en) + '</span>';
      tablist.appendChild(btn);
      buttons.push(btn);

      var panel = document.createElement('div');
      panel.className = 'tab-panel';
      panel.id = config.id + '-panel-' + item.id;
      panel.setAttribute('role', 'tabpanel');
      panel.setAttribute('aria-labelledby', btn.id);
      panel.tabIndex = 0;
      if (i !== 0) panel.hidden = true;
      panel.innerHTML = item.html;
      panels.appendChild(panel);
    });

    function select(idx) {
      buttons.forEach(function (b, i) {
        var on = i === idx;
        b.setAttribute('aria-selected', on ? 'true' : 'false');
        b.tabIndex = on ? 0 : -1;
        panels.children[i].hidden = !on;
      });
      activateBarsIn(panels.children[idx]);
      activateCountersIn(panels.children[idx]);
    }

    buttons.forEach(function (btn, i) {
      btn.addEventListener('click', function () { select(i); });
      btn.addEventListener('keydown', function (e) {
        var next = null;
        if (e.key === 'ArrowRight') next = (i + 1) % buttons.length;
        else if (e.key === 'ArrowLeft') next = (i - 1 + buttons.length) % buttons.length;
        else if (e.key === 'Home') next = 0;
        else if (e.key === 'End') next = buttons.length - 1;
        if (next !== null) { e.preventDefault(); select(next); buttons[next].focus(); }
      });
    });

    host.appendChild(tablist);
    host.appendChild(panels);
  }

  /* ============================================================
     粒子背景
     ============================================================ */
  function initParticles() {
    var canvas = $('#particles');
    if (!canvas) return;
    var ctx = canvas.getContext('2d');
    if (!ctx) return;

    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var W = 0, H = 0, parts = [], raf = null, running = true;

    function isDark() { return document.documentElement.getAttribute('data-theme') === 'dark'; }

    function build() {
      var count = Math.round(W * H / 15000);
      count = Math.max(30, Math.min(count, 100));
      if (reduceMotion) count = Math.round(count * 0.4);
      parts = [];
      for (var i = 0; i < count; i++) parts.push(makeParticle(true));
    }
    function makeParticle(init) {
      var gold = Math.random() < 0.68;
      return {
        x: Math.random() * W,
        y: init ? Math.random() * H : -12,
        r: gold ? (0.9 + Math.random() * 1.8) : (0.7 + Math.random() * 1.2),
        vy: 0.16 + Math.random() * 0.5,
        vx: (Math.random() - 0.5) * 0.24,
        a: 0.22 + Math.random() * 0.5,
        gold: gold,
        phase: Math.random() * Math.PI * 2,
        amp: 0.14 + Math.random() * 0.36
      };
    }
    function resize() {
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = Math.floor(W * dpr);
      canvas.height = Math.floor(H * dpr);
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      build();
      if (reduceMotion) staticDraw();
    }
    function staticDraw() {
      ctx.clearRect(0, 0, W, H);
      for (var i = 0; i < parts.length; i++) {
        var p = parts[i];
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.gold ? 'rgba(168,132,63,.45)' : 'rgba(168,28,28,.32)';
        ctx.fill();
      }
    }
    function tick() {
      if (!running) return;
      ctx.clearRect(0, 0, W, H);
      var dark = isDark();
      for (var i = 0; i < parts.length; i++) {
        var p = parts[i];
        p.y += p.vy;
        p.phase += 0.012;
        p.x += p.vx + Math.sin(p.phase) * p.amp * 0.32;
        if (p.y > H + 14) { parts[i] = makeParticle(false); continue; }
        if (p.x < -14) p.x = W + 14;
        if (p.x > W + 14) p.x = -14;
        var alpha = p.a * (dark ? 0.9 : 1);
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.gold
          ? (dark ? 'rgba(226,203,148,' + alpha + ')' : 'rgba(168,132,63,' + alpha + ')')
          : (dark ? 'rgba(214,69,69,' + alpha * 0.8 + ')' : 'rgba(168,28,28,' + alpha * 0.75 + ')');
        ctx.fill();
        if (p.gold && p.r > 1.5) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r * 3.2, 0, Math.PI * 2);
          ctx.fillStyle = dark ? 'rgba(212,184,122,' + (alpha * 0.08) + ')' : 'rgba(201,169,110,' + (alpha * 0.1) + ')';
          ctx.fill();
        }
      }
      raf = requestAnimationFrame(tick);
    }
    function start() { if (raf) return; running = true; raf = requestAnimationFrame(tick); }
    function stop() { running = false; if (raf) cancelAnimationFrame(raf); raf = null; }

    resize();
    if (!reduceMotion) start();
    var rt = null;
    window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(resize, 180); });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) stop(); else if (!reduceMotion) start();
    });
  }

  /* ============================================================
     主题
     ============================================================ */
  var THEME_KEY = 'yjh-resume-theme';
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    var btn = $('#themeBtn');
    if (btn) {
      var label = theme === 'dark' ? 'Light' : 'Dark';
      btn.setAttribute('aria-label', label + ' mode');
      btn.setAttribute('title', label + ' mode (T)');
    }
  }
  function switchTheme() {
    var cur = document.documentElement.getAttribute('data-theme');
    var next = cur === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  }
  function initTheme() {
    var saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(saved || (prefersDark ? 'dark' : 'light'));
    var btn = $('#themeBtn');
    if (btn) btn.addEventListener('click', switchTheme);
  }

  /* ============================================================
     语言
     ============================================================ */
  function applyLang(lang) {
    currentLang = (lang === 'en') ? 'en' : 'zh';
    document.documentElement.setAttribute('data-lang', currentLang);
    document.documentElement.setAttribute('lang', currentLang === 'en' ? 'en' : 'zh-CN');
    $$('[data-lang-btn]').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-lang-btn') === currentLang);
    });
    try { localStorage.setItem(LANG_KEY, currentLang); } catch (e) {}
    /* 更新页面圆点标签 */
    $$('#dotNav .dot').forEach(function (dot, i) {
      var page = document.getElementById(PAGE_IDS[i]);
      if (!page) return;
      var label = currentLang === 'en'
        ? (page.getAttribute('data-label-en') || page.getAttribute('data-label'))
        : page.getAttribute('data-label');
      dot.setAttribute('data-label', label);
      dot.setAttribute('aria-label', label);
    });
    /* 重启打字机 */
    startTypewriter();
  }
  function initLang() {
    var saved = null;
    try { saved = localStorage.getItem(LANG_KEY); } catch (e) {}
    applyLang(saved || 'zh');
    $$('[data-lang-btn]').forEach(function (b) {
      b.addEventListener('click', function () {
        applyLang(b.getAttribute('data-lang-btn'));
        toast(currentLang === 'en' ? 'Language: English' : '语言：中文');
      });
    });
  }

  /* ============================================================
     翻页
     ============================================================ */
  var PAGE_IDS = ['p-hero', 'p-highlights', 'p-experience', 'p-projects', 'p-skills', 'p-education', 'p-hometown'];

  function initDeck() {
    var deck = $('#deck');
    var links = $$('#navLinks a');
    var bar = $('#scrollBar');
    var pcPrev = $('#pcPrev'), pcNext = $('#pcNext'), pcHome = $('#pcHome');
    var pageNow = $('#pageNow'), pageTotal = $('#pageTotal');
    var pages = PAGE_IDS.map(function (id) { return document.getElementById(id); });

    if (pageTotal) pageTotal.textContent = String(pages.length);

    var dotNav = $('#dotNav');
    if (dotNav) {
      pages.forEach(function (p, i) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'dot';
        var label = p.getAttribute('data-label') || ('Page ' + (i + 1));
        b.setAttribute('data-label', label);
        b.setAttribute('aria-label', label);
        b.addEventListener('click', function () { goTo(i); });
        dotNav.appendChild(b);
      });
    }
    var dotEls = $$('#dotNav .dot');
    var current = 0;

    function setActive(i) {
      if (i === current) return;
      current = i;
      links.forEach(function (a) {
        a.classList.toggle('active', parseInt(a.getAttribute('data-goto'), 10) === i);
      });
      dotEls.forEach(function (d, k) {
        if (k === i) d.setAttribute('aria-current', 'true');
        else d.removeAttribute('aria-current');
      });
      if (pageNow) pageNow.textContent = String(i + 1);
      if (pcPrev) pcPrev.disabled = (i === 0);
      if (pcNext) pcNext.disabled = (i === pages.length - 1);
      revealPage(pages[i]);
      activateBarsIn(pages[i]);
      activateCountersIn(pages[i]);
    }
    function goTo(i) {
      i = Math.max(0, Math.min(i, pages.length - 1));
      var target = pages[i];
      if (!target || !deck) return;
      deck.scrollTo({ top: target.offsetTop, behavior: reduceMotion ? 'auto' : 'smooth' });
      setActive(i);
    }
    function onScroll() {
      if (!deck) return;
      var y = deck.scrollTop;
      var h = deck.scrollHeight - deck.clientHeight;
      if (bar) bar.style.width = (h > 0 ? Math.min(y / h, 1) * 100 : 0).toFixed(2) + '%';
      var idx = 0, best = Infinity;
      pages.forEach(function (pg, i) {
        var d = Math.abs(pg.offsetTop - y);
        if (d < best) { best = d; idx = i; }
      });
      setActive(idx);
    }
    if (deck) {
      deck.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', onScroll);
      onScroll();
    }
    links.forEach(function (a) {
      a.addEventListener('click', function (e) {
        e.preventDefault();
        var i = parseInt(a.getAttribute('data-goto'), 10);
        if (!isNaN(i)) goTo(i);
      });
    });
    if (pcPrev) pcPrev.addEventListener('click', function () { goTo(current - 1); });
    if (pcNext) pcNext.addEventListener('click', function () { goTo(current + 1); });
    if (pcHome) pcHome.addEventListener('click', function () { goTo(0); });

    if (deck && !isTouch && !reduceMotion) {
      var lock = false;
      deck.addEventListener('wheel', function (e) {
        if (lock) return;
        var atBottom = deck.scrollTop + deck.clientHeight >= deck.scrollHeight - 6;
        var atTop = deck.scrollTop <= 6;
        if (e.deltaY > 28 && atBottom && current < pages.length - 1) {
          lock = true; goTo(current + 1); setTimeout(function () { lock = false; }, 760);
        } else if (e.deltaY < -28 && atTop && current > 0) {
          lock = true; goTo(current - 1); setTimeout(function () { lock = false; }, 760);
        }
      }, { passive: true });
    }

    window.__deckGoTo = goTo;
    window.__deckCurrent = function () { return current; };
    window.__deckCount = function () { return pages.length; };
    setTimeout(function () { setActive(-1); setActive(0); }, 80);
  }

  function revealPage(page) {
    if (!page) return;
    var els = $$('.reveal', page);
    if (reduceMotion) { els.forEach(function (el) { el.classList.add('in'); }); return; }
    els.forEach(function (el, i) {
      if (el.classList.contains('in')) return;
      setTimeout(function () { el.classList.add('in'); }, Math.min(i * 60, 320));
    });
  }
  function activateBarsIn(root) {
    if (!root) return;
    var bars = $$('[data-bar]', root);
    if (!bars.length) return;
    if (reduceMotion) { bars.forEach(function (b) { b.classList.add('on'); }); return; }
    setTimeout(function () {
      bars.forEach(function (b, i) { setTimeout(function () { b.classList.add('on'); }, i * 70); });
    }, 120);
  }
  function activateCountersIn(root) {
    if (!root) return;
    var nums = $$('[data-num]', root);
    nums.forEach(function (n) {
      if (n.__counted) return;
      n.__counted = true;
      var target = parseInt(n.getAttribute('data-num'), 10) || 0;
      if (reduceMotion) { n.textContent = target + '%'; return; }
      countUp(n, target);
    });
  }
  function countUp(el, target) {
    var dur = 950, start = performance.now();
    function tick(now) {
      var t = Math.min((now - start) / dur, 1);
      var eased = 1 - Math.pow(1 - t, 3);
      el.textContent = Math.round(target * eased) + '%';
      if (t < 1) requestAnimationFrame(tick);
      else el.textContent = target + '%';
    }
    requestAnimationFrame(tick);
  }

  /* ============================================================
     鼠标 / 倾斜
     ============================================================ */
  function initPointer() {
    if (isTouch || reduceMotion) return;
    var ticking = false;
    window.addEventListener('mousemove', function (e) {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(function () {
        document.body.style.setProperty('--mx', (e.clientX / window.innerWidth * 100).toFixed(2) + '%');
        document.body.style.setProperty('--my', (e.clientY / window.innerHeight * 100).toFixed(2) + '%');
        document.body.classList.add('pointer-on');
        ticking = false;
      });
    }, { passive: true });
    document.addEventListener('mouseleave', function () { document.body.classList.remove('pointer-on'); });
  }
  function initTilt() {
    if (isTouch || reduceMotion) return;
    $$('[data-tilt]').forEach(function (card) {
      var raf = null, px = 0, py = 0;
      function update() {
        card.style.setProperty('--rx', (-py * 5.2).toFixed(2) + 'deg');
        card.style.setProperty('--ry', (px * 6.6).toFixed(2) + 'deg');
        card.style.setProperty('--gx', ((px + 0.5) * 100).toFixed(1) + '%');
        card.style.setProperty('--gy', ((py + 0.5) * 100).toFixed(1) + '%');
        raf = null;
      }
      card.addEventListener('mousemove', function (e) {
        var r = card.getBoundingClientRect();
        px = (e.clientX - r.left) / r.width - 0.5;
        py = (e.clientY - r.top) / r.height - 0.5;
        if (!raf) raf = requestAnimationFrame(update);
      });
      card.addEventListener('mouseleave', function () {
        card.style.setProperty('--rx', '0deg');
        card.style.setProperty('--ry', '0deg');
        card.style.setProperty('--ty', '0px');
      });
    });
  }

  /* ============================================================
     键盘
     ============================================================ */
  function initKeyboard() {
    var hint = $('#kbdHint');
    if (hint) {
      setTimeout(function () { hint.classList.add('show'); }, 1800);
      setTimeout(function () { hint.classList.remove('show'); }, 10000);
    }
    document.addEventListener('keydown', function (e) {
      var tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || (e.target && e.target.isContentEditable)) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;

      var goTo = window.__deckGoTo;
      var cur = window.__deckCurrent ? window.__deckCurrent() : 0;
      var total = window.__deckCount ? window.__deckCount() : 1;
      var k = e.key;

      if (k === 'ArrowRight' || k === 'PageDown') {
        if (cur < total - 1) { e.preventDefault(); if (goTo) goTo(cur + 1); }
      } else if (k === 'ArrowLeft' || k === 'PageUp') {
        if (cur > 0) { e.preventDefault(); if (goTo) goTo(cur - 1); }
      } else if (k === 'Home') {
        e.preventDefault(); if (goTo) goTo(0);
      } else if (k === 'End') {
        e.preventDefault(); if (goTo) goTo(total - 1);
      } else if (k === 't' || k === 'T') {
        e.preventDefault(); switchTheme(); toast('Theme switched');
      } else if (k === 'l' || k === 'L') {
        e.preventDefault();
        applyLang(currentLang === 'zh' ? 'en' : 'zh');
        toast(currentLang === 'en' ? 'Language: English' : '语言：中文');
      } else if (k === 'p' || k === 'P') {
        e.preventDefault(); window.print();
      } else if (k === 'g' || k === 'G') {
        e.preventDefault(); if (goTo) goTo(0);
      }
    });
    var printBtn = $('#printBtn');
    if (printBtn) printBtn.addEventListener('click', function () { window.print(); });
  }

  /* ============================================================
     初始化
     ============================================================ */
  function fillMeta() {
    var y = String(new Date().getFullYear());
    $$('.year').forEach(function (el) { el.textContent = y; });
    $$('.updated').forEach(function (el) { el.textContent = resume.updated; });
  }

  function init() {
    injectPageBackgrounds();
    initLang(); /* 先确定语言 */
    renderHero();
    renderHighlights();
    renderExperience();
    renderProjects();
    renderSkills();
    renderEducation();
    renderHometown();
    fillMeta();

    initTheme();
    initParticles();
    initDeck();
    initPointer();
    initTilt();
    initAvatar();
    initCertInput();
    initKeyboard();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
