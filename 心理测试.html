.eyebrow{font-size:11px;letter-spacing:.22em;font-weight:700;color:var(--green);text-transform:uppercase;margin:0 0 20px}
h1,h2,p{margin-top:0}
.landing h1,.intro-heading h1{font-family:Georgia,"Songti SC","SimSun",serif;font-size:clamp(48px,5.4vw,86px);line-height:1.15;font-weight:500;letter-spacing:-.035em;margin:0 0 30px}
.landing h1 em,.intro-heading h1 em{font-style:normal;color:var(--green)}
.lead{color:#56655d;line-height:1.9;font-size:16px;max-width:520px}
.facts{display:flex;gap:35px;margin:24px 0 38px;padding-bottom:28px;border-bottom:1px solid var(--line)}
.facts span{font-size:12px;color:var(--muted);white-space:nowrap}
.facts b{display:block;color:var(--ink);font-family:Georgia,serif;font-size:31px;font-weight:400}
.gate label{display:block;font-size:14px;font-weight:700;margin-bottom:13px}
.gate-row{display:flex;gap:10px;max-width:440px}
.gate input{min-width:0;width:145px;letter-spacing:.35em;font-size:24px;font-family:Georgia,serif;padding:13px 12px 13px 20px;background:white;border:1px solid #b7c7bb;border-radius:3px;outline:none}
.gate input:focus{border-color:var(--green);box-shadow:0 0 0 3px #dbe9dc}
.gate-row button,.primary{background:var(--green);color:white;border:1px solid var(--green);padding:15px 25px;border-radius:3px;font-weight:700;transition:.2s;white-space:nowrap}
.gate-row button:hover,.primary:hover{background:#274c3c}
button:disabled{opacity:.45;cursor:not-allowed}
.gate-note{font-size:12px;line-height:1.6;color:#849087;margin-top:13px}
.error{color:#b34f2e;font-size:13px;margin:10px 0}
.intro-wrap,.quiz-wrap,.result-wrap{max-width:1100px;margin:auto;padding:68px 28px 100px}
.intro-heading{max-width:860px}
.intro-heading h1{font-size:clamp(39px,5vw,68px)}
.intro-heading>p:last-child{color:var(--muted);line-height:1.8;font-size:16px;max-width:650px}
.axis-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:50px}
.axis-card{min-height:130px;background:#f0f2ea;border:1px solid #dde4d7;padding:21px 17px;display:flex;flex-direction:column}
.axis-card span{font:italic 18px Georgia,serif;color:#8ba595}
.axis-card strong{font-size:16px;margin-top:14px}
.axis-card small{font-size:11px;margin-top:7px;color:var(--muted)}
.intro-foot{display:flex;justify-content:space-between;align-items:center;gap:20px;border-top:1px solid var(--line);margin-top:50px;padding-top:25px;color:var(--muted);font-size:13px}
.city-list{margin-top:35px;color:var(--green);font-size:13px}
.city-list summary{cursor:pointer;font-weight:700}
.city-list div{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}
.city-list span{padding:5px 9px;border:1px solid var(--line);color:var(--muted);font-size:12px}
.quiz-wrap{max-width:860px;min-height:calc(100vh - 126px)}
.quiz-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;letter-spacing:.08em}
.text-button{border:0;background:none;color:var(--green);padding:8px 0;font-weight:650}
.progress{height:3px;background:#dce4d9;margin-top:21px}
.progress span{display:block;height:100%;background:var(--green);transition:width .25s}
.quiz-body{padding:65px 0 0}
.question-meta{display:flex;justify-content:space-between;color:var(--green);font-size:12px;letter-spacing:.12em;font-weight:700}
.quiz-body h2{font-family:Georgia,"Songti SC","SimSun",serif;font-weight:500;font-size:clamp(28px,3vw,43px);line-height:1.5;margin:26px 0 10px}
.question-hint{color:#8a968e;font-size:13px;margin-bottom:38px}
.choices{display:grid;gap:11px}
.choice{display:flex;align-items:center;gap:18px;text-align:left;width:100%;padding:19px 22px;background:#fff;border:1px solid #dbe3d9;color:var(--ink);font-size:16px;transition:.2s}
.choice:hover,.choice.selected{border-color:var(--green);background:#edf4ec}
.choice-letter{display:grid;place-items:center;flex:0 0 30px;height:30px;border-radius:50%;border:1px solid #bdccc0;color:var(--green);font:italic 15px Georgia,serif}
.choice-arrow{margin-left:auto;color:var(--green);opacity:0}
.choice:hover .choice-arrow,.choice.selected .choice-arrow{opacity:1}
.quiz-actions{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:32px;color:var(--muted);font-size:12px}
.compact{padding:11px 14px;font-size:12px}
.result-wrap{padding-top:35px}
.result-banner{position:relative;background:#294e3e;color:#fff;padding:60px clamp(28px,7vw,90px);min-height:430px;overflow:hidden}
.result-banner:after{content:"";position:absolute;width:460px;height:460px;border:1px solid #ffffff36;border-radius:50%;right:-70px;top:-80px;box-shadow:0 0 0 50px #ffffff0b,0 0 0 100px #ffffff08}
.result-banner .eyebrow{color:#bed5c4}
.result-banner>span{font-size:13px;letter-spacing:.12em}
.result-banner h1{font-family:Georgia,"Songti SC","SimSun",serif;font-size:clamp(75px,10vw,145px);font-weight:400;line-height:1.2;margin:10px 0 0;position:relative;z-index:1}
.match-big{display:flex;align-items:center;gap:12px;position:absolute;right:9%;bottom:94px;z-index:1}
.match-big b{font:italic 78px Georgia,serif;font-weight:400}
.match-big span{font-size:12px;line-height:1.5}
.result-banner>p:not(.eyebrow){margin:17px 0 25px;max-width:540px;color:#e3eee6}
.tag-row{display:flex;gap:9px}
.tag-row span{border:1px solid #ffffff78;padding:5px 11px;font-size:11px;color:#e3eee6}
.result-content{background:#fff;padding:20px clamp(26px,6vw,75px) 65px}
.result-section{padding:55px 0;border-bottom:1px solid var(--line)}
.result-section h2{font-family:Georgia,"Songti SC","SimSun",serif;font-size:32px;font-weight:500;margin-bottom:19px}
.result-prose{line-height:1.9;color:#59665d;max-width:800px}
.alignment{display:grid;grid-template-columns:repeat(3,1fr);gap:25px;margin-top:30px}
.alignment>div{background:#f5f7f2;padding:20px}
.alignment span{font-weight:700}
.alignment p{font-size:12px;color:var(--muted);margin:8px 0 0}
.alignment small{font-size:11px;color:var(--muted)}
.align-track,.profile-track{height:7px;background:#dce7dc;margin:15px 0 8px}
.align-track i,.profile-track i{display:block;height:100%;background:var(--green)}
.ranking>div{display:grid;grid-template-columns:45px 1fr 65px;align-items:center;border-bottom:1px solid var(--line);padding:17px 0}
.ranking>div>span{font:italic 23px Georgia,serif;color:#9aafa0}
.ranking b{display:block;font-size:18px;margin-bottom:3px}
.ranking small{color:var(--muted)}
.ranking strong{font:italic 29px Georgia,serif;color:var(--green);text-align:right}
.profile-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:25px 45px}
.profile-grid>div>div:first-child{display:flex;justify-content:space-between}
.profile-grid b{color:var(--green)}
.profile-grid small{display:flex;justify-content:space-between;color:#8b968d}
.profile-grid em{font-style:normal}
.method{font-size:12px;line-height:1.9;color:#8a958c;margin:28px 0}
.result-actions{display:flex;gap:12px}
.secondary{background:#fff;border:1px solid var(--green);color:var(--green);padding:15px 25px;border-radius:3px}
footer{border-top:1px solid var(--line);display:flex;justify-content:space-between;padding:18px clamp(22px,5vw,80px);font-size:11px;color:#9aa49b}
@media(max-width:800px){.landing{display:block}.hero-image{min-height:380px;height:48vh}.landing-copy{padding:45px 28px 65px}.landing h1{font-size:56px}.axis-grid{grid-template-columns:repeat(2,1fr)}.alignment{grid-template-columns:1fr}.match-big{right:8%;bottom:30px}.result-banner h1{font-size:80px}.result-banner{padding-bottom:140px}}
@media(max-width:540px){.nav{height:62px}.nav-side{display:none}.hero-image{height:34vh;min-height:270px}.landing-copy{width:100%;min-width:0}.landing h1{font-size:48px}.lead{font-size:14px;overflow-wrap:anywhere}.facts{gap:15px}.facts b{font-size:25px}.facts span{font-size:10px}.gate-row input{width:125px}.gate-row button{padding:12px 17px}.axis-grid{gap:8px}.axis-card{min-height:115px;padding:14px}.intro-wrap,.quiz-wrap,.result-wrap{padding-left:20px;padding-right:20px}.quiz-body{padding-top:45px}.quiz-body h2{font-size:30px}.choice{font-size:14px;padding:15px}.result-wrap{padding-top:10px}.result-banner{min-height:440px;padding:40px 25px 145px}.match-big b{font-size:60px}.profile-grid{grid-template-columns:1fr}.result-section h2{font-size:27px}.result-actions{flex-wrap:wrap}}
@media print{.nav,.result-actions,footer{display:none}.result-wrap{padding:0}.result-content{padding:10px 25px}.result-section{break-inside:avoid}.result-banner{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

@media(max-width:360px){.quiz-actions{gap:8px;flex-wrap:wrap}.intro-foot{flex-wrap:wrap}.gate-row{flex-wrap:wrap}.result-banner h1{font-size:66px}.choice{gap:12px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
